<h2 mat-dialog-title>{{ title }}</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
	<mat-dialog-content>
		<mat-form-field appearance="outline" subscriptSizing="dynamic" class="name-field">
			<mat-label>Name</mat-label>
			<input matInput formControlName="name" [attr.maxlength]="maximumNameLength" autocomplete="off" cdkFocusInitial />
			@if (form.controls.name.hasError("required")) {
				<mat-error>A category needs a name.</mat-error>
			}
			@if (form.controls.name.hasError("maxlength")) {
				<mat-error>A category name can be at most {{ maximumNameLength }} characters.</mat-error>
			}
		</mat-form-field>
	</mat-dialog-content>

	<mat-dialog-actions>
		<button mat-stroked-button type="button" mat-dialog-close [disabled]="loading()">Cancel</button>
		<button mat-flat-button type="submit" [disabled]="isSubmitDisabled()">{{ submitLabel }}</button>
	</mat-dialog-actions>
</form>
