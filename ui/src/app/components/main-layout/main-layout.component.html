<aside class="sidebar" [class.collapsed]="layoutService.sidebarCollapsed()">
	<a class="sidebar-brand" routerLink="/dashboard" aria-label="Penniless dashboard">
		@if (layoutService.sidebarCollapsed()) {
			<img class="sidebar-brand-logo" src="/brand/penniless-character.svg" alt="" />
		} @else {
			<picture>
				<source srcset="/brand/penniless-horizontal-dark.svg" media="(prefers-color-scheme: dark)" />
				<img class="sidebar-brand-logo" src="/brand/penniless-horizontal.svg" alt="" />
			</picture>
		}
	</a>

	<nav class="sidebar-nav" aria-label="Pages">
		@for (link of links; track link.route) {
			<a
				class="sidebar-item"
				[routerLink]="link.route"
				routerLinkActive="active"
				ariaCurrentWhenActive="page"
				[matTooltip]="link.label"
				[matTooltipDisabled]="!layoutService.sidebarCollapsed()"
				matTooltipPosition="right"
			>
				<app-main-layout-nav-icon [icon]="link.icon" />
				<span class="sidebar-item-label">{{ link.label }}</span>
			</a>
		}
	</nav>

	<nav class="sidebar-nav sidebar-settings" aria-label="Settings">
		<p class="sidebar-section-label">Settings</p>

		@for (link of settingsLinks; track link.route) {
			<a
				class="sidebar-item"
				[routerLink]="link.route"
				routerLinkActive="active"
				ariaCurrentWhenActive="page"
				[matTooltip]="link.label"
				[matTooltipDisabled]="!layoutService.sidebarCollapsed()"
				matTooltipPosition="right"
			>
				<app-main-layout-nav-icon [icon]="link.icon" />
				<span class="sidebar-item-label">{{ link.label }}</span>
			</a>
		}
	</nav>

	<button
		class="sidebar-toggle"
		mat-icon-button
		type="button"
		(click)="layoutService.toggleSidebar()"
		[attr.aria-label]="layoutService.sidebarCollapsed() ? 'Expand navigation' : 'Collapse navigation'"
		[matTooltip]="layoutService.sidebarCollapsed() ? 'Expand navigation' : 'Collapse navigation'"
		matTooltipPosition="right"
	>
		<svg
			class="sidebar-toggle-icon"
			viewBox="0 0 24 24"
			width="16"
			height="16"
			fill="none"
			stroke="currentColor"
			stroke-width="2"
			stroke-linecap="round"
			stroke-linejoin="round"
			aria-hidden="true"
		>
			<path d="M15 6l-6 6 6 6" />
		</svg>
	</button>
</aside>

<div class="content-column">
	@if (errorService.activeError(); as error) {
		<div class="error-banner" role="alert">
			<span class="error-banner-message">{{ error.message }}</span>

			<button class="error-banner-dismiss" type="button" aria-label="Dismiss error" (click)="errorService.clearError()">
				<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
					<path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
				</svg>
			</button>
		</div>
	}

	<main class="content">
		<router-outlet />
	</main>
</div>
