<div class="page-body categories-page">
	<header class="page-header">
		<div class="page-heading">
			<h1>Categories</h1>
			<p class="page-hint">Every category a transaction can carry, in the order the selects show them.</p>
		</div>

		<div class="page-actions">
			<button mat-flat-button type="button" (click)="onCreate()">Create category</button>
		</div>
	</header>

	@if (service.loading()) {
		<p class="page-hint">Loading categories…</p>
	} @else {
		<table mat-table [dataSource]="service.categories()" class="categories-table">
			<ng-container matColumnDef="name">
				<th mat-header-cell *matHeaderCellDef>Name</th>
				<td mat-cell *matCellDef="let category">
					{{ category.name }}
					@if (category.protected) {
						<span class="built-in-label">Built-in</span>
					}
				</td>
			</ng-container>

			<ng-container matColumnDef="transactions">
				<th mat-header-cell *matHeaderCellDef class="cell-count">Transactions</th>
				<td mat-cell *matCellDef="let category" class="cell-count">{{ category.transactionCount }}</td>
			</ng-container>

			<ng-container matColumnDef="rules">
				<th mat-header-cell *matHeaderCellDef class="cell-count">Rules</th>
				<td mat-cell *matCellDef="let category" class="cell-count">{{ category.ruleCount }}</td>
			</ng-container>

			<ng-container matColumnDef="actions">
				<th mat-header-cell *matHeaderCellDef class="cell-actions"><span class="visually-hidden">Actions</span></th>
				<td mat-cell *matCellDef="let category" class="cell-actions">
					<button
						mat-icon-button
						type="button"
						[disabled]="category.protected"
						[attr.aria-label]="renameLabel(category)"
						(click)="onRename(category)"
					>
						<svg
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="1.5"
							stroke-linecap="round"
							stroke-linejoin="round"
							aria-hidden="true"
						>
							<path d="M12 20h9" />
							<path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z" />
						</svg>
					</button>

					<button
						mat-icon-button
						type="button"
						[disabled]="category.protected"
						[attr.aria-label]="deleteLabel(category)"
						(click)="onDelete(category)"
					>
						<svg
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="1.5"
							stroke-linecap="round"
							stroke-linejoin="round"
							aria-hidden="true"
						>
							<path d="M3 6h18" />
							<path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2" />
							<path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
							<path d="M10 11v6" />
							<path d="M14 11v6" />
						</svg>
					</button>
				</td>
			</ng-container>

			<tr mat-header-row *matHeaderRowDef="columns"></tr>
			<tr mat-row *matRowDef="let row; columns: columns"></tr>
		</table>
	}
</div>
