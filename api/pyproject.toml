[project]
name = "penniless-api"
version = "0.1.0"
description = "Local-only personal finance dashboard API"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "httpx",
    "pandas",
    "pydantic",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "pyright",
    "pytest>=9.2.0",
    "ruff",
]

[tool.uv]
package = false
